name: 'build image'
on:
  push:
    tags:
      - v*
  pull_request:

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Set VERSION
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF#refs/tags/}

      - name: Build and push app
        uses: docker/build-push-action@v2
        with:
          push: true
          cache-from: type=registry,ref=ghcr.io/tweetgeek/hwo-api:latest
          cache-to: type=inline
          tags: |
            ghcr.io/tweetgeek/hwo-api:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/tweetgeek/hwo-api:latest
          build-args: |
            user=1000
