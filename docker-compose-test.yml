version: '3'
services:
  app:
    image: ghcr.io/tweetgeek/hwo-api
    env_file:
      - stack.env
    networks:
      - hwo
      - proxy
    depends_on:
      - mysql
      - redis
      - memcached
      - meilisearch
      - minio
      - mailpit
      - soketi
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:8000/health'
      retries: 3
      timeout: 5s
  mysql:
    image: 'mysql/mysql-server:8.0'
    env_file:
      - stack.env
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'hwo-mysql:/var/lib/mysql'
    networks:
      - hwo
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD}'
      retries: 3
      timeout: 5s
  redis:
    image: 'redis:alpine'
    env_file:
      - stack.env
    volumes:
      - 'hwo-redis:/data'
    networks:
      - hwo
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
  memcached:
    image: 'memcached:alpine'
    env_file:
      - stack.env
    networks:
      - hwo
  meilisearch:
    image: 'getmeili/meilisearch:latest'
    env_file:
      - stack.env
    volumes:
      - 'hwo-meilisearch:/meili_data'
    networks:
      - hwo
      - proxy
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--spider'
        - 'http://localhost:7700/health'
      retries: 3
      timeout: 5s
  minio:
    image: 'minio/minio:latest'
    env_file:
      - stack.env
    environment:
      MINIO_ROOT_USER: hwo
      MINIO_ROOT_PASSWORD: bx12cgg
    volumes:
      - 'hwo-minio:/data/minio'
    networks:
      - hwo
      - proxy
    command: 'minio server /data/minio --console-address ":8900"'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:9000/minio/health/live'
      retries: 3
      timeout: 5s
  mailpit:
    image: 'axllent/mailpit:latest'
    env_file:
      - stack.env
    networks:
      - hwo
      - proxy
  soketi:
    image: 'quay.io/soketi/soketi:latest-16-alpine'
    env_file:
      - stack.env
    environment:
      SOKETI_DEBUG: '${SOKETI_DEBUG:-1}'
      SOKETI_METRICS_SERVER_PORT: '9601'
      SOKETI_DEFAULT_APP_ID: '${PUSHER_APP_ID}'
      SOKETI_DEFAULT_APP_KEY: '${PUSHER_APP_KEY}'
      SOKETI_DEFAULT_APP_SECRET: '${PUSHER_APP_SECRET}'
    networks:
      - hwo
networks:
  hwo:
    driver: bridge
  proxy:
    external: true
volumes:
  hwo-mysql:
    driver: local
  hwo-redis:
    driver: local
  hwo-meilisearch:
    driver: local
  hwo-minio:
    driver: local
