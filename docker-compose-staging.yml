version: '3'
services:
  app:
    image: ghcr.io/tweetgeek/hwo-api
    environment:
      APP_URL: "http://hwo-staging.tweetgeek.pl"
      APP_ENV: staging
      APP_DEBUG: false
      APP_SUPPORTED_MOBILE_VERSION: 0.0.0
      LOG_CHANNEL: stdout
      DB_HOST: mysql
      REDIS_HOST: redis
      SANCTUM_STATEFUL_DOMAINS: hwo-staging.tweetgeek.pl
      SESSION_DOMAIN: .tweetgeek.pl
    networks:
      - hwo
      - cloudflare-tunnel
    depends_on:
      - mysql
      - redis
      - memcached
      - meilisearch
      - minio
      - mailpit
      - soketi
  mysql:
    image: 'mysql/mysql-server:8.0'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'hwo-mysql:/var/lib/mysql'
    networks:
      - hwo
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD}'
      retries: 3
      timeout: 5s
  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'hwo-redis:/data'
    networks:
      - hwo
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
  memcached:
    image: 'memcached:alpine'
    networks:
      - hwo
  meilisearch:
    image: 'getmeili/meilisearch:latest'
    volumes:
      - 'hwo-meilisearch:/meili_data'
    networks:
      - hwo
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--spider'
        - 'http://localhost:7700/health'
      retries: 3
      timeout: 5s
  minio:
    image: 'minio/minio:latest'
    environment:
      MINIO_ROOT_USER: hwo
      MINIO_ROOT_PASSWORD: password
    volumes:
      - 'hwo-minio:/data/minio'
    networks:
      - hwo
    command: 'minio server /data/minio --console-address ":8900"'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:9000/minio/health/live'
      retries: 3
      timeout: 5s
  mailpit:
    image: 'axllent/mailpit:latest'
    networks:
      - hwo
  soketi:
    image: 'quay.io/soketi/soketi:latest-16-alpine'
    environment:
      SOKETI_DEBUG: '${SOKETI_DEBUG:-1}'
      SOKETI_METRICS_SERVER_PORT: '9601'
      SOKETI_DEFAULT_APP_ID: '${PUSHER_APP_ID}'
      SOKETI_DEFAULT_APP_KEY: '${PUSHER_APP_KEY}'
      SOKETI_DEFAULT_APP_SECRET: '${PUSHER_APP_SECRET}'
    networks:
      - hwo
networks:
  hwo:
    driver: bridge
  cloudflare-tunnel:
    external: true
volumes:
  hwo-mysql:
    driver: local
  hwo-redis:
    driver: local
  hwo-meilisearch:
    driver: local
  hwo-minio:
    driver: local
